[build-system]
requires = ["setuptools>=61", "setuptools_scm>=6.3.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatecoin"
version = "0.0.0"  # managed by setuptools_scm
description = "Gatecoin Python SDK and utilities"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Md Sulaiman", email = "dev.sulaiman@icloud.com" }
]
requires-python = ">=3.8"
keywords = ["gatecoin", "ethereum", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9"
]
dependencies = [
    # These will be loaded from requirements/requirements.txt via uv pip sync / uv venv
    # OR you can manually insert them here
]

[project.urls]
Homepage = "https://github.com/gatecoin/gatecoin"

[project.optional-dependencies]
test = []  # Add your test dependencies here

[project.scripts]
gatecoin = "gatecoin.__main__:main"

[tool.setuptools]
packages = ["gatecoin"]
include-package-data = true

[tool.setuptools.package-data]
gatecoin = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.black]
line-length = 99
target-version = ["py38"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
