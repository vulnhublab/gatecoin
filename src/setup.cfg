[flake8]
ignore = B011, C814, E203, E402, E731, W503, W504, W391, C401, C408, T100, T101
max-line-length = 99
exclude = build,dist,.git,.venv,tools/ansible/contrib

[pep8]
ignore = E731, E203, E402, W503, W504, C814
max-line-length = 99

[isort]
line_length=99
known_first_party=gatecoin,gatecoin_contracts,scenario_player
default_section=THIRDPARTY
combine_as_imports=1
# black compatibility
multi_line_output=3
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True

[coverage:run]
branch = True
concurrency = gevent

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    def __repr__
    raise NotImplementedError
    assert not isinstance
    typecheck
omit =
    */.tox/*
    */.pyenv/*
    */tests/*
    */site-packages/*

[mypy]
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_configs = True
warn_unused_ignores = True
warn_unreachable = True
warn_redundant_casts = True
strict_equality = True

# These parts of gatecoin are not fully typed, yet
[mypy-gatecoin.utils.profiling.*]
disallow_untyped_defs = False
[mypy-gatecoin.utils.cli.*]
disallow_untyped_defs = False
[mypy-gatecoin.utils.http.*]
disallow_untyped_defs = False
[mypy-gatecoin.api.v1.encoding]
disallow_untyped_defs = False
[mypy-gatecoin.network.transport.matrix.rtc.aiogevent]
disallow_untyped_defs = False
warn_unreachable = False
ignore_errors = True

# The factory code is hard to type correctly
[mypy-gatecoin.tests.utils.factories]
ignore_errors = True
[mypy-gatecoin.tests.fuzz.test_state_changes]
ignore_errors = True
[mypy-gatecoin.tests.utils.transport]
ignore_errors = True
[mypy-gatecoin.tests.utils.transfer]
ignore_errors = True
[mypy-gatecoin.tests.utils.detect_failure]
disallow_untyped_defs = True

# No need to be as strict for our tools and tests
[mypy-tools.*]
disallow_untyped_defs = False
[mypy-tools.debugging.plot.*]
ignore_errors = True
[mypy-gatecoin.tests.*]
disallow_untyped_defs = False
warn_unreachable = False

# Most unit tests still lack proper typing
[mypy-gatecoin.tests.unit.*]
check_untyped_defs = False
[mypy-gatecoin.tests.unit.transfer.mediated_transfer.test_mediatorstate]
check_untyped_defs = True
[mypy-gatecoin.tests.unit.utils.*]
check_untyped_defs = True
[mypy-gatecoin.tests.unit.api.*]
check_untyped_defs = True
[mypy-gatecoin.tests.unit.storage.*]
check_untyped_defs = True
[mypy-gatecoin.tests.unit.fixtures.*]
check_untyped_defs = True
[mypy-gatecoin.tests.unit.test_gatecoin_event_handler.*]
check_untyped_defs = True
[mypy-gatecoin.tests.unit.transfer.mediated_transfer.test_mediation_fee.*]
check_untyped_defs = True

# ... so do the network tests
[mypy-gatecoin.tests.integration.network.*]
check_untyped_defs = False
